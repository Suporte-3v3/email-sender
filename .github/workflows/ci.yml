name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    # MariaDB real para os testes de integração de internal/db. 10.11 é a LTS
    # mais próxima da Pi do banco; a senha só existe dentro deste job.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MARIADB_TEST_ADDR: 127.0.0.1:3306
      MARIADB_TEST_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/arm64
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          load: true
          tags: meter-report:ci
      - name: Imagem ≤ 25 MB
        run: |
          size=$(docker image inspect -f '{{.Size}}' meter-report:ci)
          echo "imagem: $((size / 1024 / 1024)) MB ($size bytes)"
          test "$size" -le $((25 * 1024 * 1024))
      # Sem as variáveis obrigatórias o binário sempre sai com exit 1 antes de
      # conectar; o que se verifica é se o TZ foi aceito dentro do scratch.
      - name: Fuso embutido funciona no scratch
        run: |
          out=$(docker run --rm --platform linux/arm64 -e TZ=America/Sao_Paulo meter-report:ci 2>&1) && exit 1
          echo "$out"
          grep -q 'ausentes: SSH_HOST' <<<"$out"
          ! grep -q 'TZ inválido' <<<"$out"
      - name: TZ inválido falha
        run: |
          out=$(docker run --rm --platform linux/arm64 -e TZ=Nada/Isso meter-report:ci 2>&1) && exit 1
          echo "$out"
          grep -q 'TZ inválido' <<<"$out"
