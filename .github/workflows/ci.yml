name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/arm64
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64
          load: true
          tags: meter-report:ci
      - name: Imagem ≤ 25 MB
        run: |
          size=$(docker image inspect -f '{{.Size}}' meter-report:ci)
          echo "imagem: $((size / 1024 / 1024)) MB ($size bytes)"
          test "$size" -le $((25 * 1024 * 1024))
      - name: Fuso embutido funciona no scratch
        run: docker run --rm --platform linux/arm64 -e TZ=America/Sao_Paulo meter-report:ci
      - name: TZ inválido falha
        run: "! docker run --rm --platform linux/arm64 -e TZ=Nada/Isso meter-report:ci"
